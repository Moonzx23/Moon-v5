<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonBot V5 Ultimate</title>

<style>
:root{
  --bg:#060912;
  --panel:#0b1220;
  --panel2:#101a2d;
  --card:#111b2e;
  --border:#1e2b44;
  --text:#f1f5ff;
  --muted:#91a0b8;
  --accent:#6d8cff;
  --accent2:#9b6dff;
  --user:#263c7a;
  --success:#43e68c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 80% 10%,rgba(91,107,255,.12),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(155,109,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
}

button,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:275px;
  background:rgba(11,18,32,.96);
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:20px;
}

.logoIcon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 28px rgba(109,140,255,.45);
}

.logoName{
  font-size:21px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-left:5px;
  font-size:10px;
  padding:3px 6px;
  border-radius:7px;
  background:#1c2950;
  color:#aebcff;
}

.newChat{
  border:0;
  border-radius:12px;
  padding:12px;
  color:white;
  background:linear-gradient(135deg,#536fd6,#8158d8);
  font-weight:bold;
  margin-bottom:17px;
}

.newChat:hover{
  filter:brightness(1.12);
}

.sectionTitle{
  color:#6e7d98;
  font-size:10px;
  letter-spacing:1px;
  margin:8px 0;
}

.history{
  flex:1;
  overflow:auto;
}

.historyItem{
  padding:10px;
  border-radius:9px;
  margin-bottom:4px;
  font-size:12px;
  color:#b8c3d8;
  cursor:pointer;
}

.historyItem:hover{
  background:#141f33;
}

.sideActions{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.sideButton{
  background:#0f192a;
  color:#cbd5e8;
  border:1px solid var(--border);
  padding:10px;
  border-radius:9px;
  text-align:left;
}

.sideButton:hover{
  background:#17243a;
}

.creatorCard{
  margin-top:13px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  background:#080e1a;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.creatorCard strong{
  color:white;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:65px;
  border-bottom:1px solid var(--border);
  background:rgba(6,9,18,.8);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.online{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
}

.onlineDot{
  width:9px;
  height:9px;
  background:var(--success);
  border-radius:50%;
  box-shadow:0 0 12px var(--success);
}

.mode{
  background:#101a2c;
  color:white;
  border:1px solid var(--border);
  padding:8px 11px;
  border-radius:9px;
}

/* CHAT */

.chat{
  flex:1;
  overflow:auto;
  padding:30px 20px;
}

.welcome{
  max-width:850px;
  margin:40px auto;
  text-align:center;
}

.moon{
  font-size:65px;
  filter:drop-shadow(0 0 20px rgba(109,140,255,.5));
}

.welcome h1{
  margin:8px 0;
  font-size:44px;
  background:linear-gradient(90deg,#ffffff,#8197ff,#b17dff);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:var(--muted);
  line-height:1.6;
}

.featureGrid{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.feature{
  text-align:left;
  padding:16px;
  border:1px solid var(--border);
  background:rgba(15,24,42,.75);
  border-radius:15px;
}

.featureIcon{
  font-size:23px;
  margin-bottom:8px;
}

.feature b{
  display:block;
  margin-bottom:5px;
}

.feature span{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* MESSAGES */

.message{
  max-width:900px;
  margin:0 auto 18px;
  display:flex;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#18243b;
}

.messageContent{
  max-width:82%;
  padding:13px 16px;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.6;
  font-size:14px;
}

.user .messageContent{
  background:var(--user);
}

.bot .messageContent{
  background:var(--card);
  border:1px solid var(--border);
}

/* COMPOSER */

.composerArea{
  border-top:1px solid var(--border);
  padding:14px 20px 18px;
  background:#070c16;
}

.composer{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.voice,
.send{
  width:48px;
  height:48px;
  border-radius:13px;
  border:1px solid var(--border);
  color:white;
  background:#101a2b;
}

.send{
  border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:18px;
}

textarea{
  flex:1;
  min-height:48px;
  max-height:150px;
  resize:none;
  border:1px solid var(--border);
  outline:none;
  border-radius:14px;
  background:#10192a;
  color:white;
  padding:13px 15px;
}

textarea:focus{
  border-color:#6178d7;
}

.hint{
  max-width:900px;
  margin:7px auto 0;
  color:#59677f;
  text-align:center;
  font-size:10px;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    width:68px;
    padding:10px;
  }

  .logoName,
  .badge,
  .sectionTitle,
  .history,
  .creatorCard{
    display:none;
  }

  .newChat{
    font-size:0;
    height:45px;
  }

  .newChat::after{
    content:"+";
    font-size:20px;
  }

  .sideButton{
    font-size:0;
    text-align:center;
  }

  .featureGrid{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:32px;
  }

  .chat{
    padding:18px 12px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="logo">
    <div class="logoIcon">🌙</div>

    <div class="logoName">
      MoonBot
      <span class="badge">V5</span>
    </div>
  </div>

  <button class="newChat" onclick="newChat()">
    ＋ New Chat
  </button>

  <div class="sectionTitle">
    CHAT HISTORY
  </div>

  <div class="history" id="history"></div>

  <div class="sideActions">

    <button class="sideButton" onclick="showCreator()">
      👤 Creator
    </button>

    <button class="sideButton" onclick="showMoonHistory()">
      📖 Sejarah MoonBot
    </button>

    <button class="sideButton" onclick="showCapabilities()">
      🧠 Kebolehan
    </button>

    <button class="sideButton" onclick="toggleTheme()">
      🌗 Tukar Tema
    </button>

    <button class="sideButton" onclick="clearAll()">
      🗑️ Padam Chat
    </button>

  </div>

  <div class="creatorCard">
    <strong>MoonBot V5</strong><br>
    Creator: <strong>Nazreel</strong><br>
    Started: 2026<br>
    Assisted by: ChatGPT
  </div>

</aside>


<!-- MAIN -->

<main class="main">

<header class="topbar">

  <div class="online">
    <span class="onlineDot"></span>
    MoonBot V5 Online
  </div>

  <select class="mode" id="mode">
    <option value="normal">😊 Normal</option>
    <option value="study">🧠 Study</option>
    <option value="creative">🎨 Creative</option>
    <option value="code">💻 Coding</option>
    <option value="quick">⚡ Quick Answer</option>
  </select>

</header>


<section class="chat" id="chat"></section>


<div class="composerArea">

  <div class="composer">

    <button class="voice" onclick="voiceInput()">
      🎙️
    </button>

    <textarea
      id="input"
      placeholder="Tanya MoonBot apa sahaja..."
      onkeydown="keyHandler(event)"
    ></textarea>

    <button class="send" onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="hint">
    MoonBot V5 Ultimate · JavaScript Edition · Tanpa API
  </div>

</div>

</main>

</div>


<script>

/* =====================================================
   MOONBOT V5 ULTIMATE
   Creator: Nazreel
   Year: 2026
   Assisted by: ChatGPT
===================================================== */


/* =========================
   DATA
========================= */

let messages =
JSON.parse(localStorage.getItem("moonbot_v5_messages") || "[]");

let historyTitles =
JSON.parse(localStorage.getItem("moonbot_v5_history") || "[]");

let theme =
localStorage.getItem("moonbot_v5_theme") || "dark";


/* =========================
   STARTUP
========================= */

applyTheme();
renderHistory();
renderChat();


/* =========================
   THEME
========================= */

function applyTheme(){

  if(theme === "light"){

    document.documentElement.style.setProperty("--bg","#f2f5fa");
    document.documentElement.style.setProperty("--panel","#ffffff");
    document.documentElement.style.setProperty("--card","#ffffff");
    document.documentElement.style.setProperty("--border","#dce3ed");
    document.documentElement.style.setProperty("--text","#101827");
    document.documentElement.style.setProperty("--muted","#617087");
    document.documentElement.style.setProperty("--user","#dbe5ff");

  }else{

    document.documentElement.style.setProperty("--bg","#060912");
    document.documentElement.style.setProperty("--panel","#0b1220");
    document.documentElement.style.setProperty("--card","#111b2e");
    document.documentElement.style.setProperty("--border","#1e2b44");
    document.documentElement.style.setProperty("--text","#f1f5ff");
    document.documentElement.style.setProperty("--muted","#91a0b8");
    document.documentElement.style.setProperty("--user","#263c7a");

  }
}


function toggleTheme(){

  theme = theme === "dark" ? "light" : "dark";

  localStorage.setItem(
    "moonbot_v5_theme",
    theme
  );

  applyTheme();

}


/* =========================
   CHAT RENDER
========================= */

function renderChat(){

  const chat=document.getElementById("chat");

  if(messages.length===0){

    chat.innerHTML=`

      <div class="welcome">

        <div class="moon">🌙</div>

        <h1>MoonBot V5</h1>

        <p>
          MoonBot V5 Ultimate ialah chatbot JavaScript
          yang dibina oleh Nazreel pada tahun 2026.
          Versi ini tidak menggunakan API.
        </p>

        <div class="featureGrid">

          <div class="feature">
            <div class="featureIcon">🧠</div>
            <b>Smart Brain</b>
            <span>
              Knowledge database, BM, English,
              slang dan soalan umum.
            </span>
          </div>

          <div class="feature">
            <div class="featureIcon">📚</div>
            <b>Study</b>
            <span>
              BM, Matematik, Sains, Sejarah,
              Geografi dan pengetahuan am.
            </span>
          </div>

          <div class="feature">
            <div class="featureIcon">🧮</div>
            <b>Tools</b>
            <span>
              Calculator, converter,
              tarikh dan masa.
            </span>
          </div>

          <div class="feature">
            <div class="featureIcon">💻</div>
            <b>Coding</b>
            <span>
              HTML, CSS dan JavaScript asas.
            </span>
          </div>

          <div class="feature">
            <div class="featureIcon">🎙️</div>
            <b>Voice</b>
            <span>
              Voice input menggunakan browser.
            </span>
          </div>

          <div class="feature">
            <div class="featureIcon">💾</div>
            <b>Memory</b>
            <span>
              Chat history disimpan dalam browser.
            </span>
          </div>

        </div>

      </div>
    `;

    return;

  }


  chat.innerHTML="";

  messages.forEach(message=>{

    const div=document.createElement("div");

    div.className="message "+message.role;

    div.innerHTML=`

      <div class="avatar">
        ${message.role==="user" ? "👤" : "🌙"}
      </div>

      <div class="messageContent">
        ${escapeHTML(message.text)}
      </div>
    `;

    chat.appendChild(div);

  });

}


function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SEND
========================= */

function sendMessage(){

  const input=document.getElementById("input");

  const text=input.value.trim();

  if(!text)return;

  addMessage("user",text);

  input.value="";

  saveTitle(text);

  setTimeout(()=>{

    addMessage(
      "bot",
      moonBrain(text)
    );

  },180);

}


function addMessage(role,text){

  messages.push({
    role:role,
    text:text,
    time:Date.now()
  });

  localStorage.setItem(
    "moonbot_v5_messages",
    JSON.stringify(messages)
  );

  renderChat();

  const chat=document.getElementById("chat");

  setTimeout(()=>{
    chat.scrollTop=chat.scrollHeight;
  },20);

}


/* =========================
   HISTORY
========================= */

function saveTitle(text){

  if(historyTitles[historyTitles.length-1]===text)
    return;

  historyTitles.push(text);

  historyTitles=historyTitles.slice(-20);

  localStorage.setItem(
    "moonbot_v5_history",
    JSON.stringify(historyTitles)
  );

  renderHistory();

}


function renderHistory(){

  const box=document.getElementById("history");

  box.innerHTML="";

  historyTitles
    .slice()
    .reverse()
    .forEach(title=>{

      const div=document.createElement("div");

      div.className="historyItem";

      div.textContent="💬 "+title.slice(0,35);

      box.appendChild(div);

    });

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  messages=[];

  localStorage.setItem(
    "moonbot_v5_messages",
    JSON.stringify(messages)
  );

  renderChat();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  if(!confirm("Padam semua chat MoonBot?"))
    return;

  messages=[];

  historyTitles=[];

  localStorage.removeItem("moonbot_v5_messages");

  localStorage.removeItem("moonbot_v5_history");

  renderChat();

  renderHistory();

}


/* =========================
   KEY
========================= */

function keyHandler(event){

  if(event.key==="Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   VOICE
========================= */

function voiceInput(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    alert(
      "Voice input tidak disokong browser ini. Cuba Google Chrome."
    );

    return;

  }

  const recognition=new Recognition();

  recognition.lang="ms-MY";

  recognition.interimResults=false;

  recognition.onresult=function(event){

    document.getElementById("input").value =
      event.results[0][0].transcript;

  };

  recognition.start();

}


/* =====================================================
   TOOLS
===================================================== */


/* CALCULATOR */

function calculator(text){

  let expression=text
    .replace(/berapa/gi,"")
    .replace(/kira/gi,"")
    .replace(/calculate/gi,"")
    .replace(/hasil/gi,"")
    .replace(/=/g,"")
    .trim();

  if(!/^[0-9+\-*/().%\s]+$/.test(expression))
    return null;

  try{

    const result=Function(
      '"use strict";return ('+
      expression+
      ')'
    )();

    if(Number.isFinite(result)){

      return "🧮 Jawapan: "+result;

    }

  }catch(error){}

  return null;

}


/* UNIT */

function unitConverter(text){

  const match=text.match(
    /(\d+(?:\.\d+)?)\s*(km|m|cm|mm|kg|g|mg)\s*(?:ke|to)\s*(km|m|cm|mm|kg|g|mg)/i
  );

  if(!match)return null;

  const value=parseFloat(match[1]);

  const from=match[2].toLowerCase();

  const to=match[3].toLowerCase();


  const length={
    km:1000,
    m:1,
    cm:.01,
    mm:.001
  };

  const weight={
    kg:1000,
    g:1,
    mg:.001
  };


  if(length[from] && length[to]){

    const meters=value*length[from];

    const result=meters/length[to];

    return `🔄 ${value} ${from} = ${result} ${to}`;

  }


  if(weight[from] && weight[to]){

    const grams=value*weight[from];

    const result=grams/weight[to];

    return `⚖️ ${value} ${from} = ${result} ${to}`;

  }

  return null;

}


/* TIME */

function timeAnswer(){

  return "🕒 Sekarang pukul "+
    new Date().toLocaleTimeString(
      "ms-MY",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

}


/* DATE */

function dateAnswer(){

  return "📅 Hari ini ialah "+
    new Date().toLocaleDateString(
      "ms-MY",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    )+".";

}


/* =====================================================
   KNOWLEDGE BRAIN
===================================================== */

function moonBrain(original){

  const text=original
    .toLowerCase()
    .replace(/[?!.,;:]/g," ")
    .replace(/\s+/g," ")
    .trim();


  /* TOOLS */

  const calc=calculator(text);

  if(calc)return calc;


  const unit=unitConverter(text);

  if(unit)return unit;


  /* TIME */

  if(
    text.includes("pukul berapa") ||
    text.includes("jam berapa") ||
    text.includes("masa sekarang") ||
    text.includes("current time")
  ){

    return timeAnswer();

  }


  /* DATE */

  if(
    text.includes("tarikh hari ini") ||
    text.includes("hari ini tarikh") ||
    text.includes("date today")
  ){

    return dateAnswer();

  }


  /* GREETINGS */

  if(
    /^(hai|hi|hello|helo|hey|wei|weh|yo|salam)$/.test(text)
  ){

    return random([
      "Hejj wei 😎🌙 MoonBot V5 dah online.",
      "Yo 😎 Apa cerita hari ni?",
      "Haiii 👋 MoonBot standby.",
      "Hehe hai 😂 Nak sembang atau test aku?"
    ]);

  }


  /* IDENTITY */

  if(
    text.includes("siapa kau") ||
    text.includes("kau siapa") ||
    text.includes("siapa awak") ||
    text.includes("what are you")
  ){

    return `🌙 Aku MoonBot V5 Ultimate.

Aku ialah chatbot berasaskan HTML + CSS + JavaScript.

Aku boleh:
🧠 Knowledge asas
📚 Study
🧮 Calculator
🔄 Converter
🕒 Masa
📅 Tarikh
💻 Coding
🎨 Creative ideas
🎙️ Voice input
💾 Chat history
🌗 Theme
📖 Sejarah projek

Aku tidak menggunakan API.

Jadi aku bukan LLM sebenar seperti ChatGPT, tetapi aku boleh mempunyai banyak fungsi melalui JavaScript.`;

  }


  /* CREATOR */

  if(
    text.includes("siapa pencipta moonbot") ||
    text.includes("siapa creator moonbot") ||
    text.includes("siapa buat moonbot") ||
    text.includes("pencipta moonbot")
  ){

    return `👤 PENCIPTA MOONBOT

Nama: Nazreel
Projek: MoonBot
Versi: V5 Ultimate
Tahun bermula: 2026
Dibantu oleh: ChatGPT

MoonBot ialah projek chatbot peribadi yang dibangunkan menggunakan teknologi web seperti HTML, CSS dan JavaScript. 🌙`;

  }


  /* NAZREEL */

  if(
    text==="nazreel" ||
    text.includes("siapa nazreel") ||
    text.includes("tentang nazreel")
  ){

    return `👤 NAZREEL

Nazreel ialah pencipta projek MoonBot.

Pada tahun 2026, Nazreel mula membina idea chatbot sendiri menggunakan teknologi web.

Daripada idea tersebut, MoonBot berkembang melalui beberapa versi sehingga MoonBot V5.

🌙 MoonBot ialah projek yang dibina daripada idea, eksperimen dan pembelajaran.`;

  }


  /* HISTORY */

  if(
    text.includes("sejarah moonbot") ||
    text.includes("history moonbot") ||
    text.includes("bagaimana moonbot dicipta") ||
    text.includes("macam mana moonbot dicipta")
  ){

    return `📖 SEJARAH MOONBOT

Pada suatu malam pada tahun 2026, Nazreel mendapat idea untuk mencipta sebuah chatbot sendiri.

Dengan bantuan ChatGPT, Nazreel mula belajar membina chatbot menggunakan HTML dan JavaScript.

Daripada idea kecil itu lahirlah MoonBot.

Projek tersebut berkembang melalui beberapa versi.

MoonBot kemudian dibayangkan sebagai sistem yang lebih besar dengan:

🧠 Intelligence
🔎 Web knowledge
💬 Conversation
💾 Memory
🎙️ Voice
👁️ Vision
💻 Coding
🧰 Tools

Versi ini ialah MoonBot V5 Ultimate tanpa API.

Ia direka sebagai eksperimen untuk membina chatbot menggunakan teknologi web sahaja.

🌙 "Satu idea pada waktu malam menjadi permulaan kepada sebuah projek."`;

  }


  /* VERSION */

  if(
    text.includes("versi moonbot") ||
